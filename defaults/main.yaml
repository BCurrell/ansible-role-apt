---
###
#
###

# Define empty lists to guarantee that the variable exists.
apt_keys: []
apt_auths: []
apt_sources: []
apt_preferences: []

# APT base directory
apt_basepath: '/etc/apt'

# APT directory for keys
apt_keys_basepath:
  path: '{{ apt_basepath }}/keyrings'
  state: 'directory'
  owner: 'root'
  group: 'root'
  mode: '0755'

# APT directory for auths
apt_auths_basepath:
  path: '{{ apt_basepath }}/auth.conf.d'
  state: 'directory'
  owner: 'root'
  group: 'root'
  mode: '0755'

# APT directory for sources
apt_sources_basepath:
  path: '{{ apt_basepath }}/sources.list.d'
  state: 'directory'
  owner: 'root'
  group: 'root'
  mode: '0755'

# APT directory for preferences
apt_preferences_basepath:
  path: '{{ apt_basepath }}/preferences.d'
  state: 'directory'
  owner: 'root'
  group: 'root'
  mode: '0755'

# APT key file defaults with provided contents
apt_key_file_defaults_content:
  src: 'templates/apt_key.j2'
  owner: 'root'
  group: 'root'
  mode: '0640'

# APT key file defaults with downloaded file
apt_key_file_defaults_download:
  owner: 'root'
  group: 'root'
  mode: '0640'

# APT auth file defaults
apt_auth_defaults:
  src: 'templates/apt_auth.j2'
  owner: 'root'
  group: 'root'
  mode: '0640'

# APT source file defaults
apt_source_defaults:
  src: 'templates/apt_source.j2'
  owner: 'root'
  group: 'root'
  mode: '0640'

# APT source file default contents
apt_source_content_defaults:
  architectures: []
  components:
    - 'main'
  suites:
    - "{{ ansible_facts['distribution_release'] }}"
  types:
    - 'deb'

# APT preference file defaults
apt_preference_file_default:
  src: 'templates/apt_preference.j2'
  owner: 'root'
  group: 'root'
  mode: '0640'
